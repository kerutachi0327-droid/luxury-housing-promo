name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check plan dimensions against the brochure
        run: npm run check
      - name: Build viewer
        run: npm run build
      - name: Check and build TYPE06
        run: |
          npm run check:type06
          npm run build:type06
      - name: Prepare site
        run: |
          # Site root (/): type-selection page
          mkdir -p _site/assets
          cp top/index.html _site/
          cp top/assets/*.jpg _site/assets/
          if [ -f CREDITS.md ]; then cp CREDITS.md _site/; fi
          # TYPE02 (/type02/)
          mkdir -p _site/type02/assets
          cp index.html style.css _site/type02/
          cp -r dist _site/type02/dist
          cp assets/*.png _site/type02/assets/ 2>/dev/null || true
          if [ -f CREDITS.md ]; then cp CREDITS.md _site/type02/; fi
          # cache-bust the bundle and stylesheet per commit
          sed -i "s#dist/app.js#dist/app.js?v=${GITHUB_SHA::8}#; s#style.css#style.css?v=${GITHUB_SHA::8}#" _site/type02/index.html
          # TYPE06 (/type06/): same engine and assets, its own plan and bundle
          mkdir -p _site/type06/assets
          cp type06/index.html style.css _site/type06/
          cp -r type06/dist _site/type06/dist
          cp type06/assets/*.jpg _site/type06/assets/
          if [ -f CREDITS.md ]; then cp CREDITS.md _site/type06/; fi
          sed -i "s#dist/app.js#dist/app.js?v=${GITHUB_SHA::8}#; s#style.css#style.css?v=${GITHUB_SHA::8}#" _site/type06/index.html
          # Shared CC0 library (/shared/lib/): one copy for every type, so the
          # browser cache carries it from one type to the next
          if [ -d assets/lib ]; then mkdir -p _site/shared && cp -r assets/lib _site/shared/lib; fi
          for f in _site/type*/index.html; do
            sed -i 's#<meta charset="utf-8">#<meta charset="utf-8">\n<meta name="asset-lib" content="../shared/lib/">#' "$f"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
