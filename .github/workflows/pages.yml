name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check plan dimensions against the brochure
        run: npm run check
      - name: Build viewer
        run: npm run build
      - name: Prepare site
        run: |
          mkdir -p _site/assets
          cp index.html style.css _site/
          cp -r dist _site/dist
          cp assets/*.png _site/assets/ 2>/dev/null || true
          if [ -d assets/lib ]; then cp -r assets/lib _site/assets/lib; fi
          if [ -f CREDITS.md ]; then cp CREDITS.md _site/; fi
          # cache-bust the bundle and stylesheet per commit
          sed -i "s#dist/app.js#dist/app.js?v=${GITHUB_SHA::8}#; s#style.css#style.css?v=${GITHUB_SHA::8}#" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
